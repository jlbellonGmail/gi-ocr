[GAS]
Title=Servicio de Gas
Fields=importe,cliente,nro_medidor,a_pagar_hasta,periodo

Field.importe.Label=Importe
Field.importe.Example=$ 23.345,56
Field.importe.Type=amount
Field.importe.Required=true
Field.importe.Patterns=importe|total|saldo|a pagar
Field.importe.Regex=(?:importe|total|saldo|a\s+pagar)\D{0,40}(\$?\s?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})|\$?\s?\d+(?:[.,]\d{2})|\$?\s?\d+)
Field.importe.ConfidenceAutoAccept=0.88
Field.importe.ConfidenceNeedsReview=0.55
Field.importe.Sensitive=true
Field.importe.BlockOnValidationFail=true

Field.cliente.Label=Cliente
Field.cliente.Example=045-987654
Field.cliente.Type=text
Field.cliente.Required=true
Field.cliente.Patterns=cliente|nro cliente|n° cliente|numero cliente
Field.cliente.Regex=(?:cliente|nro cliente|n° cliente|numero cliente)\D{0,40}([0-9\-]{6,20})
Field.cliente.ConfidenceAutoAccept=0.85
Field.cliente.ConfidenceNeedsReview=0.50
Field.cliente.Sensitive=false
Field.cliente.BlockOnValidationFail=false

Field.nro_medidor.Label=Nro Medidor
Field.nro_medidor.Example=34572
Field.nro_medidor.Type=text
Field.nro_medidor.Required=false
Field.nro_medidor.Patterns=medidor|nro medidor|n° medidor|numero medidor
Field.nro_medidor.Regex=(?:medidor|nro medidor|n° medidor|numero medidor)\D{0,40}([0-9\-]{4,20})
Field.nro_medidor.ConfidenceAutoAccept=0.80
Field.nro_medidor.ConfidenceNeedsReview=0.45
Field.nro_medidor.Sensitive=false
Field.nro_medidor.BlockOnValidationFail=false

Field.a_pagar_hasta.Label=A pagar hasta
Field.a_pagar_hasta.Example=20/06/2026
Field.a_pagar_hasta.Type=date
Field.a_pagar_hasta.Required=false
Field.a_pagar_hasta.Patterns=a pagar hasta|pagar hasta|vencimiento|vence
Field.a_pagar_hasta.Regex=(?:a pagar hasta|pagar hasta|vencimiento|vence)\D{0,40}([0-9]{1,2}[\/\-\.\*][0-9]{1,2}[\/\-\.\*][0-9]{2,4})
Field.a_pagar_hasta.ConfidenceAutoAccept=0.85
Field.a_pagar_hasta.ConfidenceNeedsReview=0.50
Field.a_pagar_hasta.Sensitive=false
Field.a_pagar_hasta.BlockOnValidationFail=false

Field.periodo.Label=Periodo
Field.periodo.Example=01/2026
Field.periodo.Type=text
Field.periodo.Required=false
Field.periodo.Patterns=periodo|período
Field.periodo.Regex=(?:periodo|período)\D{0,40}([0-9]{1,2}[/-][0-9]{2,4})
Field.periodo.ConfidenceAutoAccept=0.80
Field.periodo.ConfidenceNeedsReview=0.45
Field.periodo.Sensitive=false
Field.periodo.BlockOnValidationFail=false

[CEVT]
Title=Servicio CEVT
Fields=medidor_numero,periodo,vencimiento,codigo_pago_electronico,total_a_pagar

Field.medidor_numero.Label=Medidor N°
Field.medidor_numero.Example=12345
Field.medidor_numero.Type=text
Field.medidor_numero.Required=false
Field.medidor_numero.Patterns=medidor|medidor n°|n° medidor|numero medidor
Field.medidor_numero.Regex=(?:medidor|medidor\s*n°|n°\s*medidor|numero\s*medidor)\D{0,40}(\d{4,15})
Field.medidor_numero.ConfidenceAutoAccept=0.85
Field.medidor_numero.ConfidenceNeedsReview=0.50
Field.medidor_numero.Sensitive=false
Field.medidor_numero.BlockOnValidationFail=false

Field.periodo.Label=Periodo
Field.periodo.Example=01/2026
Field.periodo.Type=text
Field.periodo.Required=false
Field.periodo.Patterns=periodo|período|billing period|periodo factura
Field.periodo.Regex=(?:periodo|período|billing\s*period|periodo\s*factura)\D{0,40}(\d{1,2}[/-]\d{4})
Field.periodo.ConfidenceAutoAccept=0.80
Field.periodo.ConfidenceNeedsReview=0.45
Field.periodo.Sensitive=false
Field.periodo.BlockOnValidationFail=false

Field.vencimiento.Label=Vencimiento
Field.vencimiento.Example=15/12/2024
Field.vencimiento.Type=date
Field.vencimiento.Required=false
Field.vencimiento.Patterns=vencimiento|vence|fecha de pago|fecha limite
Field.vencimiento.Regex=(?:vencimiento|vence|fecha\s+de\s*pago|fecha\s*limite)\D{0,40}(\d{1,2}[\/\-\.\*]\d{1,2}[\/\-\.\*]\d{4})
Field.vencimiento.ConfidenceAutoAccept=0.85
Field.vencimiento.ConfidenceNeedsReview=0.50
Field.vencimiento.Sensitive=false
Field.vencimiento.BlockOnValidationFail=false

Field.codigo_pago_electronico.Label=Código de Pago Electrónico
Field.codigo_pago_electronico.Example=ABC123456
Field.codigo_pago_electronico.Type=text
Field.codigo_pago_electronico.Required=false
Field.codigo_pago_electronico.Patterns=código pago electrónico|código de pago|codigo de pago electronico|referencia
Field.codigo_pago_electronico.Regex=(?:código\s*pago\s*electrónico|código\s*de\s*pago|codigo\s*de\s*pago\s*electronico|referencia)\D{0,40}([A-Z0-9]{1,20})
Field.codigo_pago_electronico.ConfidenceAutoAccept=0.88
Field.codigo_pago_electronico.ConfidenceNeedsReview=0.55
Field.codigo_pago_electronico.Sensitive=true
Field.codigo_pago_electronico.BlockOnValidationFail=true

Field.total_a_pagar.Label=Total a Pagar
Field.total_a_pagar.Example=$ 1.234,56
Field.total_a_pagar.Type=amount
Field.total_a_pagar.Required=false
Field.total_a_pagar.Patterns=total a pagar|total|pagar|a pagar|importe total
Field.total_a_pagar.Regex=(?:total\s*a\s*pagar|total|pagar|a\s*pagar|importe\s*total)\D{0,40}(\$?\s?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})|\$?\s?\d+(?:[.,]\d{2})|\$?\s?\d+)
Field.total_a_pagar.ConfidenceAutoAccept=0.88
Field.total_a_pagar.ConfidenceNeedsReview=0.55
Field.total_a_pagar.Sensitive=true
Field.total_a_pagar.BlockOnValidationFail=true
