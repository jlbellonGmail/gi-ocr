name: Post-merge feature close

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: close-feature-develop
  cancel-in-progress: false

jobs:
  close-feature:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Derivar slug de feature
        id: feature
        shell: bash
        run: |
          head_ref='${{ github.event.pull_request.head.ref }}'
          if [[ "$head_ref" =~ ^feature/([0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
          else
            echo "La rama '$head_ref' no sigue feature/NN-slug; no hay cierre automatico de ROADMAP."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted develop
        if: steps.feature.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Git
        if: steps.feature.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cerrar feature en ROADMAP remoto
        if: steps.feature.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/close-feature.ps1 `
            -Slug '${{ steps.feature.outputs.slug }}' `
            -Branch '${{ steps.feature.outputs.branch }}' `
            -PrNumber ${{ github.event.pull_request.number }} `
            -SkipLocalCleanup
