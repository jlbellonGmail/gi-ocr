name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Tests (pytest)
        run: pytest -v

  quality:
    # Job independiente de "test" (no bloquea ni depende de pytest):
    # lint, formato, type-checks y auditoria de dependencias de la
    # feature 18-calidad-ci-supply-chain. Ver
    # docs/tecnica/calidad-ci-supply-chain.md para el detalle de cada
    # paso y las decisiones de configuracion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias de desarrollo (incluye runtime fijado via -r)
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check backend/app backend/tests scripts tests

      - name: Formato (ruff format --check)
        run: ruff format --check backend/app backend/tests scripts tests

      - name: Type checks (mypy backend/app)
        run: mypy backend/app

      - name: Auditoria de vulnerabilidades - runtime (pip-audit, gate)
        # Gate obligatorio contra backend/requirements.txt (dependencias
        # que SI llegan a produccion). Las excepciones explicitas y
        # justificadas (CVE/ID + motivo, revisadas en cada cambio de
        # requirements.txt) viven en backend/config/pip-audit-ignore.txt,
        # nunca silenciadas ni logradas deshabilitando este paso.
        run: |
          set -euo pipefail
          IGNORE_ARGS=()
          IGNORE_FILE="backend/config/pip-audit-ignore.txt"
          if [ -f "$IGNORE_FILE" ]; then
            while IFS= read -r line; do
              entry="${line%%#*}"
              entry="$(echo "$entry" | xargs)"
              if [ -n "$entry" ]; then
                IGNORE_ARGS+=("--ignore-vuln" "$entry")
              fi
            done < "$IGNORE_FILE"
          fi
          pip-audit -r backend/requirements.txt "${IGNORE_ARGS[@]}"

      - name: Auditoria de vulnerabilidades - dev (pip-audit, informativo)
        # Informativo, NO gate (ver criterio 6 del spec de
        # 18-calidad-ci-supply-chain): cubre requirements-dev.txt
        # (incluye playwright sin fijar, scaffolding de la feature
        # 17-pruebas-e2e-mobile-real, y ruff/mypy/pip-audit fijados por
        # esta feature). continue-on-error evita que un hallazgo aqui
        # tumbe el job; el resultado queda visible en el log/summary.
        continue-on-error: true
        run: pip-audit -r backend/requirements-dev.txt
