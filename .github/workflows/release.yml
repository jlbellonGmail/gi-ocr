name: Release

# Disparado UNICAMENTE por push de un tag que matchea v* (semver, ej.
# v1.2.3), nunca en cada commit ni en push/PR a develop/main (eso lo
# cubre ci.yml). El humano tagea manualmente despues de mergear a main
# (ver AGENTS.md, seccion Versionado; ROADMAP.md, seccion Versionado).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar que el tag matchea semver (vX.Y.Z)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' no matchea el patron semver vX.Y.Z. No se publica imagen." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Login en GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombre de imagen (lowercase, requerido por GHCR)
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build y push de la imagen
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
