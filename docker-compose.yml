# Levanta el backend FastAPI (que sirve tambien el frontend estatico) en
# un solo comando: `docker compose up -d`. Ver
# docs/usuario/empaquetado-despliegue.md para el paso a paso completo y
# docs/tecnica/empaquetado-despliegue.md para el detalle de arquitectura.
#
# Rutas relativas al propio archivo (./storage_bridge, ./output,
# ./inbound, ./backend/config/services.ini) para funcionar igual en
# Windows (Docker Desktop) y Linux (Docker Engine) sin edicion manual.
services:
  gi-ocr:
    build: .
    image: gi-ocr:latest
    ports:
      - "8000:8000"
    volumes:
      # Integracion por filesystem con el sistema externo/legacy
      # (inbound/ready/failed, ADR-001).
      - ./storage_bridge:/app/storage_bridge
      # Estado de jobs y documentos confirmados (JobStore, DATA_DIR).
      - ./output:/app/output
      # Carpeta observada por InboundWatcher para encolar documentos
      # nuevos automaticamente (distinta de storage_bridge/inbound/).
      - ./inbound:/app/inbound
      # Configuracion de extraccion por servicio (ADR-007, texto plano).
      # Bind mount de ARCHIVO individual: el archivo debe existir en el
      # host ANTES del primer `docker compose up` (ver troubleshooting en
      # docs/tecnica/empaquetado-despliegue.md); si no existe, Docker crea
      # un directorio vacio en su lugar y el backend falla al arrancar.
      - ./backend/config/services.ini:/app/backend/config/services.ini
    restart: unless-stopped
